<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="Arial, Helvetica, sans-serif">
<title>In the field the receiver and a CORS station record separately; after fieldwork the CORS file corrects the field log</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
  </marker>
</defs>
<rect width="980" height="460" fill="#ffffff"/>

<rect x="16" y="16" width="464" height="428" rx="12" fill="#f5f7fa" stroke="#c9d1db" stroke-width="1.5"/>
<text x="248" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">In the field</text>
<text x="248" y="76" text-anchor="middle" font-size="14" fill="#444">Each records on its own</text>

<rect x="56" y="150" width="28" height="20" rx="3" fill="#2e7d32"/>
<rect x="62" y="155" width="16" height="10" fill="#c8e6c9"/>
<text x="70" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Your receiver</text>
<text x="70" y="210" text-anchor="middle" font-size="13" fill="#444">Recording</text>
<text x="70" y="228" text-anchor="middle" font-size="13" fill="#444">at your site</text>

<line x1="130" y1="160" x2="330" y2="160" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="230" cy="160" r="14" fill="#ffffff" stroke="#d32f2f" stroke-width="2"/>
<line x1="220" y1="150" x2="240" y2="170" stroke="#d32f2f" stroke-width="2"/>
<text x="230" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#d32f2f">No connection</text>
<text x="230" y="198" text-anchor="middle" font-size="13" fill="#444">Nothing is sent</text>
<text x="230" y="216" text-anchor="middle" font-size="13" fill="#444">while you work</text>

<rect x="360" y="118" width="36" height="52" rx="2" fill="#1f5fa8"/>
<rect x="372" y="96" width="12" height="26" fill="#1f5fa8"/>
<circle cx="378" cy="90" r="6" fill="#7fb0e6" stroke="#1f5fa8" stroke-width="2"/>
<text x="378" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">CORS station</text>
<text x="378" y="210" text-anchor="middle" font-size="13" fill="#444">Recording</text>
<text x="378" y="228" text-anchor="middle" font-size="13" fill="#444">all day</text>

<rect x="70" y="280" width="150" height="110" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="145" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">Your log</text>
<text x="145" y="338" text-anchor="middle" font-size="13" fill="#444">Raw observations</text>
<text x="145" y="358" text-anchor="middle" font-size="13" fill="#444">from the site</text>

<rect x="276" y="280" width="150" height="110" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="351" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5fa8">CORS log</text>
<text x="351" y="338" text-anchor="middle" font-size="13" fill="#444">Reference data</text>
<text x="351" y="358" text-anchor="middle" font-size="13" fill="#444">at a known point</text>

<rect x="500" y="16" width="464" height="428" rx="12" fill="#f5f7fa" stroke="#c9d1db" stroke-width="1.5"/>
<text x="732" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">After fieldwork</text>
<text x="732" y="76" text-anchor="middle" font-size="14" fill="#444">Software corrects your log</text>

<rect x="548" y="120" width="140" height="72" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="618" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">Your log</text>
<text x="618" y="174" text-anchor="middle" font-size="13" fill="#444">from the field</text>

<rect x="776" y="120" width="140" height="72" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="846" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5fa8">CORS file</text>
<text x="846" y="174" text-anchor="middle" font-size="13" fill="#444">same hours</text>

<line x1="618" y1="192" x2="680" y2="248" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="846" y1="192" x2="784" y2="248" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="590" y="252" width="284" height="78" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="732" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Processing software</text>
<text x="732" y="308" text-anchor="middle" font-size="13" fill="#444">Removes the shared error</text>

<line x1="732" y1="330" x2="732" y2="368" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="590" y="372" width="284" height="48" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="732" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d32">Corrected positions</text>
</svg>
