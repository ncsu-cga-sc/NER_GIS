site_name: Geospatial Knowledge Hub
theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.tabs          # Home and Trainings as top tabs
    - navigation.sections      # group items in the sidebar
    - navigation.indexes       # index.md acts as section landing page
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  generator: false

nav:
  - Home: index.md
  - Trainings:
      - trainings/index.md
      - GNSS Fundamentals for Accurate Data Collection:
          - trainings/gnss/fundamentals/index.md
          - 1. GNSS Basics: trainings/gnss/fundamentals/01-gnss-basic.md
          - 2. Where Errors Come From: trainings/gnss/fundamentals/02-where-errors-come-from.md
          - 3. Precise Is Not Accurate: trainings/gnss/fundamentals/03-precise-is-not-accurate.md
          - 4. Same Place, Different Numbers: trainings/gnss/fundamentals/04-same-place-different-numbers.md
          - 5. Corrections: trainings/gnss/fundamentals/05-corrections.md
          - 6. Hard Places: trainings/gnss/fundamentals/06-hard-places.md
          - 7. Planning for Post-Processing: trainings/gnss/fundamentals/07-planning-for-post-processing.md

# Category pages stay published, but they are not navigation items.
not_in_nav: |
  trainings/gnss/index.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details        # collapsible blocks
  - pymdownx.superfences    # allows nesting code/other content inside

extra_css:
  - assets/css/extra.css

plugins:
  - search
  - tags:
      listings_layout: cards
      listings_toc: false

extra_javascript:
  - javascripts/self-check.js
  - javascripts/toc-align.js
  - javascripts/enlarge.js
  - javascripts/training-tags.js