{% for mapping in listing.mappings %}
  <li class="training-card-source" hidden data-tag="{{ listing.tag.name }}" data-url="{{ mapping.item.url | url }}" data-title="{{ mapping.item.title }}" data-description="{{ mapping.item.meta.description | default('') }}"{% if mapping.item.meta.image %} data-image="{{ mapping.item.meta.image | url }}"{% endif %}></li>
{% endfor %}
